<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bevezetés a számítógépi grafikába – interaktív, kétnyelvű egyetemi tananyag.">
  <title>Bevezetés a számítógépi grafikába</title>
  <link rel="stylesheet" href="css/main.css">
  <script>
    (() => { try { document.documentElement.dataset.theme = localStorage.getItem('bevgraf-theme') || 'light'; } catch {} })();
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
      options: { enableMenu: false },
      startup: { typeset: true, ready: () => { MathJax.startup.defaultReady(); document.dispatchEvent(new Event('mathjax-ready')); } }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="reader-page">
  <header class="topbar">
    <button class="icon-button mobile-menu" id="menuToggle" type="button" aria-label="Menü megnyitása" aria-expanded="false" aria-controls="sidebar">☰</button>
    <a class="brand" href="index.html" aria-label="Főoldal">
      <span class="brand-mark" aria-hidden="true">⌁</span>
      <span class="brand-copy"><strong data-i18n="courseShort">Számítógépi grafika</strong><small data-i18n="courseType">Interaktív tananyag</small></span>
    </a>
    <div class="topbar-actions">
      <label class="control-label" for="languageSelect" data-i18n="language">Nyelv</label>
      <select id="languageSelect" class="header-select" aria-label="Language / Nyelv"><option value="hu">HU</option><option value="en">EN</option></select>
      <label class="control-label" for="themeSelect" data-i18n="appearance">Megjelenés</label>
      <select id="themeSelect" class="header-select theme-select" aria-label="Megjelenés / Appearance">
        <option value="light" data-i18n="light">Világos</option>
        <option value="dark" data-i18n="dark">Sötét</option>
        <option value="contrast" data-i18n="contrast">Nagy kontraszt</option>
      </select>
    </div>
  </header>
  <div class="reader-layout">
    <aside class="sidebar" id="sidebar" aria-label="Tananyag navigáció">
      <div class="sidebar-inner">
        <div class="sidebar-caption" data-i18n="chapters">FEJEZETEK</div>
        <nav id="chapterNav"></nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-caption" data-i18n="onThisPage">EZEN AZ OLDALON</div>
        <nav id="sectionNav" class="section-nav"></nav>
        <div class="sidebar-footer" data-i18n="courseFooter">Bevezetés a számítógépi grafikába · 1. verzió</div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay" hidden></div>
    <main class="reader-main" id="main">
      <div class="article-wrap">
        <div class="eyebrow"><span class="eyebrow-line"></span><span id="chapterTag">01. FEJEZET</span></div>
        <article id="article" class="article" aria-live="polite"><p class="loading">A tananyag betöltése...</p></article>
        <footer class="article-footer"><span data-i18n="footerNote">A példák a böngésző natív Canvas 2D API-ját használják.</span></footer>
      </div>
    </main>
  </div>
</body>
</html>

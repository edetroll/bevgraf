<!doctype html><html lang="hu" data-theme="light" data-contrast="off" data-language="hu"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#28549b">
<title>Algoritmusok összehasonlítása – Bevezetés a számítógépi grafikába</title><link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/styles.css"></head>
<body class="demo-page raster-compare-page" data-root="../../">
<header class="topbar demo-topbar"><div class="topbar-inner demo-topbar-inner"><div class="demo-title-group">
<a class="demo-back" href="../../chapters/02/index.html" aria-label="Vissza a fejezethez">←</a><img src="../../assets/logo.svg" class="demo-logo" width="34" height="34" alt=""><span class="demo-title"><span data-lang="hu">Szakaszrajzoló algoritmusok összehasonlítása</span><span data-lang="en">Comparing line algorithms</span></span></div>
<div class="header-controls"><div class="control-group"><button type="button" id="languageButton" class="icon-button">HU</button><button type="button" id="themeButton" class="icon-button">☾</button><button type="button" id="contrastButton" class="icon-button">Kontraszt</button></div></div></div></header>
<main class="compare-main"><div class="compare-controls"><label><span data-lang="hu">Példa:</span><span data-lang="en">Preset:</span> <select id="presetSelect"><option value="steep" data-ui-hu="Meredek szakasz" data-ui-en="Steep segment">Meredek szakasz</option><option value="half" data-ui-hu="Félpixeles helyzet" data-ui-en="Half-pixel ties">Félpixeles helyzet</option><option value="shallow" data-ui-hu="Lapos szakasz" data-ui-en="Shallow segment">Lapos szakasz</option><option value="negative" data-ui-hu="Csökkenő szakasz" data-ui-en="Descending segment">Csökkenő szakasz</option><option value="vertical" data-ui-hu="Függőleges szakasz" data-ui-en="Vertical segment">Függőleges szakasz</option><option value="custom" data-ui-hu="Saját végpontok" data-ui-en="Custom endpoints">Saját végpontok</option></select></label>
<label>x₀ <input id="x0" type="number" min="0" max="19" step="1" value="2"></label>
<label>y₀ <input id="y0" type="number" min="0" max="13" step="1" value="2"></label>
<label>x₁ <input id="x1" type="number" min="0" max="19" step="1" value="5"></label>
<label>y₁ <input id="y1" type="number" min="0" max="13" step="1" value="11"></label></div>
<div class="compare-panels">
<section class="compare-panel"><header><strong><span data-lang="hu">Egyszerű növekményes</span><span data-lang="en">Simple incremental</span></strong><span id="incCount"></span></header><canvas id="incCanvas" width="620" height="530" aria-label="A növekményes algoritmus képpontjai"></canvas></section>
<section class="compare-panel"><header><strong>DDA</strong><span id="ddaCount"></span></header><canvas id="ddaCanvas" width="620" height="530" aria-label="A DDA-algoritmus képpontjai"></canvas></section>
<section class="compare-panel"><header><strong>Midpoint</strong><span id="midCount"></span></header><canvas id="midCanvas" width="620" height="530" aria-label="A Midpoint-algoritmus képpontjai"></canvas></section>
</div><div class="compare-status" id="compareStatus" aria-live="polite"></div></main>
<script src="../../assets/site.js"></script><script src="../../assets/raster-render.js"></script><script src="../../assets/compare-runner.js"></script></body></html>

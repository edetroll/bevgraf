<!doctype html>
<html lang="hu" data-theme="light" data-contrast="off" data-language="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#265196">
<meta name="description" content="Bevezetés a számítógépi grafikába – JavaScript Canvas-demó">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/styles.css">
<title>Demó – Bevezetés a számítógépi grafikába</title>
</head>
<body class="demo-page" data-demo="pixel" data-root="../../">
<a class="skip-link" href="#main" style="position:absolute;left:-9999px">Ugrás a tartalomhoz</a>
<header class="topbar demo-topbar">
  <div class="topbar-inner demo-topbar-inner">
    <div class="demo-title-group">
      <a class="demo-back" href="../../index.html" title="Vissza a fejezethez / Back to chapter" aria-label="Vissza a fejezethez / Back to chapter">←</a>
      <img src="../../assets/logo.svg" class="demo-logo" width="34" height="34" alt="">
      <span id="demoHeading" class="demo-title">Demó</span>
    </div>
    <div class="header-controls" aria-label="Megjelenítési beállítások">
      <div class="control-group">
        <button type="button" id="languageButton" class="icon-button" aria-label="Switch to English">HU</button>
        <button type="button" id="themeButton" class="icon-button" aria-label="Téma váltása">☾</button>
        <button type="button" id="contrastButton" class="icon-button" aria-label="Kisegítő nagy kontrasztú mód" aria-pressed="false">Kontraszt</button>
      </div>
    </div>
  </div>
</header>
<main class="demo-main" id="main">
<div class="demo-workspace" id="demoWorkspace">
<section class="demo-pane" aria-label="JavaScript kódszerkesztő">
  <div class="pane-title">
    <span>JavaScript</span>
    <div class="pane-actions">
      <button type="button" id="codeDecrease" class="icon-button" title="Kód kisebb / Smaller code font" aria-label="Kód kisebb">A−</button>
      <span data-code-size class="code-size-label">16 px</span>
      <button type="button" id="codeIncrease" class="icon-button" title="Kód nagyobb / Larger code font" aria-label="Kód nagyobb">A+</button>
      <button type="button" id="copyCode" class="icon-button" data-ui-hu="Másolás" data-ui-en="Copy">Másolás</button>
      <button type="button" id="resetCode" class="icon-button" data-ui-hu="Visszaállítás" data-ui-en="Reset">Visszaállítás</button>
      <button type="button" id="runCode" class="icon-button primary" data-ui-hu="Futtatás" data-ui-en="Run">Futtatás</button>
    </div>
  </div>
  <div class="editor-box" id="editorBox">
    <pre class="highlight-layer" aria-hidden="true"><code id="highlightedCode"></code></pre>
    <textarea id="codeEditor" class="code-editor" wrap="off" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  </div>
  <div class="pane-hint"><span data-lang="hu">Ctrl+Enter: futtatás · Ctrl+görgő: kódméret</span><span data-lang="en">Ctrl+Enter: run · Ctrl+wheel: code size</span></div>
</section>
<div class="workspace-splitter" id="workspaceSplitter" role="separator" tabindex="0" aria-label="Panelek szélességének módosítása" aria-orientation="vertical" title="Húzással átméretezhető / Drag to resize"></div>
<section class="demo-pane" aria-label="Canvas rajzterület">
  <div class="pane-title">
    <span><span data-lang="hu">Eredmény</span><span data-lang="en">Output</span></span>
    <span class="canvas-size-label">860 × 480</span>
  </div>
  <div class="canvas-wrap">
    <canvas width="860" height="480" id="demoCanvas" aria-label="A kód által rajzolt ábra / Drawing produced by the code"></canvas>
  </div>
  <div id="runnerStatus" class="runner-status" role="status" aria-live="polite"></div>
</section>
</div>
</main>
<script src="../../assets/highlight.js"></script>
<script src="../../assets/site.js"></script>
<script src="../../assets/graphics.js"></script>
<script src="../../assets/examples.js"></script>
<script src="../../assets/demo-runner.js"></script>
</body></html>
